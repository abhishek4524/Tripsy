services:
  - type: worker
    name: goa-trip-concierge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: WEATHER_API_KEY
        sync: false
